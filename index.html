<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Absensi Hari Sabtu</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --border: #e2e8f0;
      --hadir-bg: #dcfce7;
      --hadir-text: #15803d;
      --absen-bg: #fee2e2;
      --absen-text: #b91c1c;
      --libur-bg: #dbeafe;
      --libur-text: #1d4ed8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 16px;
      color: #1e293b;
    }
    .container {
      max-width: 950px;
      margin: auto;
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .badge-jadwal {
      background: #fef3c7;
      color: #92400e;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { opacity: 0.9; }
    .table-responsive {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px 12px;
    }
    th {
      background: #f1f5f9;
      font-size: 13px;
    }
    .cell-absen {
      cursor: pointer;
      text-align: center;
      font-weight: 500;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .cell-absen:hover { filter: brightness(0.95); }
    .status-hadir {
      background-color: var(--hadir-bg);
      color: var(--hadir-text);
    }
    .status-absen {
      background-color: var(--absen-bg);
      color: var(--absen-text);
    }
    .status-libur {
      background-color: var(--libur-bg);
      color: var(--libur-text);
    }
    .status-kosong {
      background: #f8fafc;
      color: #94a3b8;
    }
    /* Modal Popup */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
    }
    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    .btn-hadir { background: #16a34a; }
    .btn-tidak-masuk { background: #dc2626; }
    .btn-libur { background: #2563eb; }
    .btn-batal { background: #64748b; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2 style="margin:0 0 4px 0;">Presensi Hari Sabtu</h2>
      <div id="labelBulan" style="font-weight: 600; color: #64748b;"></div>
    </div>
    <div class="badge-jadwal">
      Jadwal: Sabtu | 09:00 - 12:00 WIB
    </div>
    <div class="actions">
      <button onclick="bukaModalMember()">+ Kelola Member</button>
    </div>
  </div>

  <div class="table-responsive">
    <table id="tabelAbsen">
      <thead>
        <tr id="headerRow"></tr>
      </thead>
      <tbody id="bodyRow">
        <tr><td colspan="6" style="text-align:center;">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Pilihan Absensi -->
<div class="modal" id="modalAbsen">
  <div class="modal-box">
    <h3 style="margin-top:0;" id="modalTitle">Pilih Kehadiran</h3>
    <p id="modalSub" style="color:#64748b; font-size:14px; margin-bottom:12px;"></p>
    <div class="modal-buttons">
      <button class="btn-hadir" onclick="kirimAbsen('Hadir')">✔ Hadir</button>
      <button class="btn-tidak-masuk" onclick="kirimAbsen('Absen')">✖ Tidak Masuk (Absen)</button>
      <button class="btn-libur" onclick="kirimAbsen('Libur')">🏖️ Hari Libur</button>
      <button class="btn-batal" onclick="tutupModal('modalAbsen')">Batal</button>
    </div>
  </div>
</div>

<!-- Modal Tambah/Edit Member -->
<div class="modal" id="modalMember">
  <div class="modal-box">
    <h3 style="margin-top:0;">Tambah Member</h3>
    <input type="text" id="memberNama" placeholder="Nama Lengkap" style="width:100%; padding:8px; box-sizing:border-box; margin-bottom:10px;" />
    <div style="display:flex; gap:8px;">
      <button onclick="simpanMember()">Simpan</button>
      <button class="btn-batal" onclick="tutupModal('modalMember')">Tutup</button>
    </div>
  </div>
</div>

<script>
  // GANTI DENGAN URL APPS SCRIPT ANDA
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6-ASJ6Q_8I7rCAo-WVmmrx4OMbs7YJNTe0D4ZQ9ViuhqtLsMKgJZFR4-_76ovTaTHew/exec";

  let dataSaturdays = [];
  let currentMembers = [];
  let currentAttendance = {};
  let selectedContext = null;

  const now = new Date();
  const currentMonth = now.getMonth();
  const currentYear = now.getFullYear();

  // Hitung semua hari Sabtu dalam bulan aktif
  function getSaturdaysInMonth(year, month) {
    const dates = [];
    const date = new Date(year, month, 1);
    while (date.getMonth() === month) {
      if (date.getDay() === 6) {
        dates.push(new Date(date));
      }
      date.setDate(date.getDate() + 1);
    }
    return dates;
  }

  async function loadData() {
    dataSaturdays = getSaturdaysInMonth(currentYear, currentMonth);
    const namaBulan = now.toLocaleDateString("id-ID", { month: "long", year: "numeric" });
    document.getElementById("labelBulan").innerText = namaBulan;

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getData&month=${currentMonth}&year=${currentYear}`);
      const data = await res.json();
      if (data.status === "success") {
        currentMembers = data.members;
        currentAttendance = data.attendance;
        renderTable();
      }
    } catch (err) {
      alert("Gagal memuat data dari Spreadsheet: " + err.message);
    }
  }

  function renderTable() {
    // 1. Render Header
    const header = document.getElementById("headerRow");
    let hHtml = `<th style="width: 40px;">No</th><th>Nama</th>`;
    dataSaturdays.forEach((sat, idx) => {
      const tgl = sat.getDate();
      hHtml += `<th style="text-align:center;">Sabtu ke-${idx+1}<br><small style="font-weight:normal;">(${tgl})</small></th>`;
    });
    header.innerHTML = hHtml;

    // 2. Render Body
    const body = document.getElementById("bodyRow");
    if (!currentMembers.length) {
      body.innerHTML = `<tr><td colspan="${2 + dataSaturdays.length}" style="text-align:center;">Belum ada member.</td></tr>`;
      return;
    }

    let bHtml = "";
    currentMembers.forEach((m, idx) => {
      bHtml += `<tr><td>${idx + 1}</td><td><strong>${m.nama}</strong></td>`;
      dataSaturdays.forEach((sat, sIdx) => {
        const dateKey = sat.toISOString().split("T")[0];
        const key = `${m.id}_${dateKey}`;
        const status = currentAttendance[key] || "";

        let cls = "status-kosong";
        let label = "—";

        if (status === "Hadir") {
          cls = "status-hadir";
          label = "✔ Hadir";
        } else if (status === "Absen") {
          cls = "status-absen";
          label = "Absen";
        } else if (status === "Libur") {
          cls = "status-libur";
          label = "Libur";
        }

        bHtml += `<td class="cell-absen ${cls}" onclick="bukaModalAbsen('${m.id}', '${m.nama}', '${dateKey}', ${sIdx+1})">${label}</td>`;
      });
      bHtml += `</tr>`;
    });
    body.innerHTML = bHtml;
  }

  function bukaModalAbsen(memberId, nama, tanggalSabtu, sabtuKe) {
    selectedContext = { memberId, nama, tanggalSabtu, sabtuKe };
    document.getElementById("modalTitle").innerText = `Absensi: ${nama}`;
    document.getElementById("modalSub").innerText = `Sabtu ke-${sabtuKe} (${tanggalSabtu})`;
    document.getElementById("modalAbsen").classList.add("active");
  }

  function bukaModalMember() {
    document.getElementById("modalMember").classList.add("active");
  }

  function tutupModal(id) {
    document.getElementById(id).classList.remove("active");
  }

  async function kirimAbsen(status) {
    if (!selectedContext) return;
    tutupModal("modalAbsen");

    const payload = {
      action: "submitAbsen",
      ...selectedContext,
      status: status
    };

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      
      if (result.status === "forbidden") {
        alert(result.message);
      } else if (result.status === "success") {
        // Update tampilan lokal
        const key = `${selectedContext.memberId}_${selectedContext.tanggalSabtu}`;
        currentAttendance[key] = status;
        renderTable();
      } else {
        alert("Gagal: " + result.message);
      }
    } catch (err) {
      alert("Error: " + err.message);
    }
  }

  async function simpanMember() {
    const nama = document.getElementById("memberNama").value.trim();
    if (!nama) return alert("Nama tidak boleh kosong!");

    const newId = "M" + String(Date.now()).slice(-4);
    const payload = { action: "addMember", id: newId, nama: nama };

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      document.getElementById("memberNama").value = "";
      tutupModal("modalMember");
      loadData();
    } catch (err) {
      alert("Error tambah member: " + err.message);
    }
  }

  // Mulai load data saat halaman dibuka
  loadData();
</script>
</body>
</html>
